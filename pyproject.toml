[tool.uv]
package = false

[project]
name = "hatchup-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "alireza",email = "alirezaghanati@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<4.0"


dependencies = [
    "django (>=6.0,<7.0)",
    "djangorestframework (==3.16.0)",
    "drf-spectacular (==0.27.2)",
    "djangorestframework-simplejwt (==5.5.1)",
    "django-redis (==5.4.0)",
    "django-fsm-2 (==4.1.0)",
    "psycopg2-binary (==2.9.11)",
    "python-dotenv (==1.0.1)",
    "pillow (>=12.2.0)",
    "django-storages (==1.14.2)",
    "boto3 (==1.34.59)",
    "django-jsonform (==2.23.2)",
    "django-money (==3.5.4)",
    "django-filter (==25.2)",
    "drf-yasg (==1.21.14)",
    "python-magic (==0.4.27)",
    "django-ckeditor-5 (==0.2.19)",
    "six (==1.17.0)",
    "sentry-sdk (>=2.0.0,<3.0.0)",
    "django-cors-headers (>=4.3.0)",
    "whitenoise (>=6.8.0)",
    "argon2-cffi (>=23.1.0)",
]


[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "isort>=6.0.0",
    "mypy>=1.13.0",
    "django-stubs[compatible-mypy]>=5.1.0",
    "djangorestframework-stubs>=3.15.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-sugar>=1.0.0",
    "factory-boy>=3.3.0",
]


[tool.pytest.ini_options]
minversion = "8.0"
DJANGO_SETTINGS_MODULE = "core.settings"
addopts = "--reuse-db --import-mode=importlib"
python_files = ["test_*.py", "tests.py"]


[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "core.settings"


[tool.ruff]
line-length = 120
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "S", "B", "A", "C4", "DJ", "ISC",
    "PIE", "PT", "Q", "RET", "SIM", "TID", "PTH", "PL", "RUF",
]
ignore = [
    "S101",     # asserts (used in tests)
    "RUF012",   # mutable class attributes
    "DJ001",    # nullable string field
    "INP001",   # implicit namespace package (Django apps)
    "PLC0415",  # import outside top-level (signals/circular)
    "PLR0911",  # too many returns
    "PLR0913",  # too many args
    "PLR2004",  # magic numbers
    "S105",     # hardcoded password (test defaults)
    "S106",     # hardcoded password (test defaults)
    "RUF005",   # unpacking style (a + b vs [*a, *b]) — opinionated
    "RET504",   # unnecessary assignment before return — opinionated
    "SIM108",   # ternary vs if/else — opinionated
    "SIM102",   # nested if — sometimes clearer
    "UP042",    # str+Enum vs StrEnum — both fine
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F403", "F405"]
"core/settings.py" = ["F403", "F405", "E402"]
"core/packages/ckeditor.py" = ["N816"]  # CKEditor config keys are mixedCase
"scripts/*" = ["S607", "PLW1510"]       # scripts call `uv` etc. by name
"*/tests/*" = ["S101", "S106", "PLR2004"]

[tool.ruff.lint.isort]
force-single-line = true


[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["apps", "core"]
